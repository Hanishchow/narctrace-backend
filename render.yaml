services:
  - type: web
    name: narctrace-backend
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn -k uvicorn.workers.UvicornWorker -w 2 -b 0.0.0.0:$PORT app.main:app
    healthCheckPath: /api/health
    envVars:
      # Pin to Python 3.11 — scikit-image 0.24.0 does not build on 3.14.
      - key: PYTHON_VERSION
        value: "3.11.9"
      # Allowed browser origins: GitHub Pages frontend + localhost dev.
      # Add any custom domain here separated by commas.
      - key: CORS_ORIGINS
        value: "https://hanishchow.github.io,http://localhost:5173"
      # Production mode: enables startup guard that refuses to boot with demo defaults.
      - key: NARCTRACE_ENV
        value: production
      # EVIDENCE_SIGNING_KEY — set this secret in the Render dashboard
      # (Environment → Secret Files or Secret Env Vars). The server refuses
      # to start in production until this is set to a non-demo value.
      # Generate one with: python -c "import secrets; print(secrets.token_hex(32))"
      - key: EVIDENCE_SIGNING_KEY
        sync: false
      # Starts on the local SQLite/filesystem store so the first deploy boots with
      # zero external creds. Switch to "insforge" once INSFORGE_* keys are set below.
      # NOTE: Render free tier has an ephemeral disk — local history resets on redeploy;
      # move to InsForge for durable evidence storage.
      - key: STORE_BACKEND
        value: local
      - key: INSFORGE_API_URL
        sync: false
      - key: INSFORGE_SERVICE_KEY
        sync: false
      - key: INSFORGE_EVIDENCE_BUCKET
        value: evidence
      - key: APP_VERSION
        value: "0.1.0"
